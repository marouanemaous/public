<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
</head>
<body>
<title>PowerShell Practical Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap">
<style>
:root {
  --bg: #eceff3;
  --surface: #ffffff;
  --surface-2: #f5f7fa;
  --ink: #161b24;
  --muted: #5a6372;
  --line: #d8dde5;
  --line-strong: #c3cad5;
  --accent: #1f5fbf;
  --accent-soft: #e3ecfa;
  --accent-ink: #ffffff;
  --console-bg: #012456;
  --console-ink: #eef1f7;
  --console-muted: #9fb3d9;
  --code-bg: #f3f5f8;
  --ok: #1f7a48;
  --ok-soft: #e1f2e8;
  --warn: #9a5c00;
  --warn-soft: #fbefd9;
  --bad: #b3312a;
  --bad-soft: #f8e2e0;
  --tok-kw: #8a2d9c;
  --tok-cmd: #1f5fbf;
  --tok-var: #a1470d;
  --tok-str: #1f7a48;
  --tok-com: #7a8392;
  --tok-op: #5a6372;
  --tok-type: #0f7a8a;
  --tok-num: #a1470d;
  --shadow: 0 1px 2px rgba(20, 30, 50, .06), 0 4px 16px rgba(20, 30, 50, .06);
  --sans: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0e1218; --surface: #151a22; --surface-2: #1b212b; --ink: #e4e8ef; --muted: #95a0b0;
    --line: #29303b; --line-strong: #3a4250; --accent: #6ea3f5; --accent-soft: #1b2a44; --accent-ink: #0b1220;
    --console-bg: #081a3d; --console-ink: #eef1f7; --console-muted: #8ea3cc; --code-bg: #10151c;
    --ok: #52c486; --ok-soft: #15301f; --warn: #e3a643; --warn-soft: #33260f; --bad: #f06c62; --bad-soft: #3a1a18;
    --tok-kw: #d59bea; --tok-cmd: #7fb0ff; --tok-var: #f0a36b; --tok-str: #8fd19e; --tok-com: #6d7888;
    --tok-op: #a8b2c1; --tok-type: #62c9d6; --tok-num: #f0a36b;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0e1218; --surface: #151a22; --surface-2: #1b212b; --ink: #e4e8ef; --muted: #95a0b0;
  --line: #29303b; --line-strong: #3a4250; --accent: #6ea3f5; --accent-soft: #1b2a44; --accent-ink: #0b1220;
  --console-bg: #081a3d; --console-ink: #eef1f7; --console-muted: #8ea3cc; --code-bg: #10151c;
  --ok: #52c486; --ok-soft: #15301f; --warn: #e3a643; --warn-soft: #33260f; --bad: #f06c62; --bad-soft: #3a1a18;
  --tok-kw: #d59bea; --tok-cmd: #7fb0ff; --tok-var: #f0a36b; --tok-str: #8fd19e; --tok-com: #6d7888;
  --tok-op: #a8b2c1; --tok-type: #62c9d6; --tok-num: #f0a36b;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--sans);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
h1, h2, h3, h4 { margin: 0; line-height: 1.25; text-wrap: balance; font-weight: 600; }
p { margin: 0; }
code, pre, .mono { font-family: var(--mono); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tabnums { font-variant-numeric: tabular-nums; }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 8px;
  height: 38px; padding: 0 16px; border-radius: 6px;
  border: 1px solid var(--line-strong); background: var(--surface); color: var(--ink);
  font-weight: 500; font-size: 14px; cursor: pointer; white-space: nowrap;
  transition: background .12s, border-color .12s;
}
.btn:hover:not(:disabled) { background: var(--surface-2); border-color: var(--muted); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); border-color: var(--accent); }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost { background: transparent; border-color: transparent; color: var(--muted); }
.btn.ghost:hover:not(:disabled) { background: var(--surface-2); color: var(--ink); border-color: transparent; }
.btn.sm { height: 32px; padding: 0 12px; font-size: 13px; }
.btn.flag-on { border-color: var(--warn); color: var(--warn); background: var(--warn-soft); }

.label {
  font-size: 11.5px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: var(--muted);
}
.chip {
  display: inline-flex; align-items: center; gap: 6px; height: 26px; padding: 0 10px;
  border-radius: 999px; font-size: 12.5px; font-weight: 500;
  background: var(--surface-2); border: 1px solid var(--line); color: var(--muted);
  white-space: nowrap;
}
.chip strong { color: var(--ink); font-weight: 600; }

/* ---------- Intro ---------- */
.intro { padding-inline: 16px; padding-block: 40px 56px; }
.intro-card {
  max-width: 880px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line);
  border-radius: 10px; box-shadow: var(--shadow); overflow: hidden;
}
.intro-head { padding: 32px 36px 28px; border-bottom: 1px solid var(--line); display: grid; gap: 12px; }
.prompt-line { font-family: var(--mono); font-size: 13px; color: var(--muted); }
.prompt-line b { color: var(--accent); font-weight: 500; }
.intro-head h1 { font-size: 30px; letter-spacing: -.01em; }
.intro-head p { color: var(--muted); max-width: 62ch; }
.intro-body { padding: 28px 36px 32px; display: grid; gap: 28px; }
.facts { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.fact { background: var(--surface); padding: 14px 18px; display: grid; gap: 2px; }
.fact .v { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.plan-table { width: 100%; border-collapse: collapse; font-size: 14px; }
.plan-table th { text-align: left; font-weight: 600; font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); padding: 0 12px 8px 0; border-bottom: 1px solid var(--line); }
.plan-table td { padding: 10px 12px 10px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.plan-table td.n, .plan-table th.n { text-align: right; font-variant-numeric: tabular-nums; font-family: var(--mono); padding-right: 0; padding-left: 12px; }
.plan-table tr:last-child td { border-bottom: 0; }
.plan-table .qn { font-family: var(--mono); color: var(--muted); width: 36px; }
.rules { display: grid; gap: 8px; padding-left: 18px; margin: 0; color: var(--ink); }
.rules li::marker { color: var(--muted); }
.start-row { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 24px; }
.field { display: grid; gap: 6px; flex: 1 1 260px; max-width: 360px; }
.input {
  height: 40px; padding: 0 12px; border-radius: 6px; border: 1px solid var(--line-strong);
  background: var(--surface); color: var(--ink); font: inherit;
}
.input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: var(--accent); }
.intro-foot { max-width: 880px; margin: 14px auto 0; display: flex; justify-content: flex-end; }
.table-wrap { overflow-x: auto; }

/* ---------- Test shell ---------- */
.shell { display: grid; grid-template-rows: auto 1fr; min-height: 100%; }
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 16px; padding-inline: 20px; padding-block: 10px;
  background: var(--surface); border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; flex: 1; }
.brand .glyph {
  width: 28px; height: 28px; border-radius: 5px; background: var(--console-bg); color: var(--console-ink);
  display: grid; place-items: center; font-family: var(--mono); font-size: 13px; font-weight: 600; flex: none;
}
.brand .t { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand .c { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.timer {
  display: flex; align-items: center; gap: 10px; padding: 4px 12px 4px 10px; border-radius: 6px;
  border: 1px solid var(--line); background: var(--surface-2);
}
.timer .clock { font-family: var(--mono); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; letter-spacing: .02em; }
.timer .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); }
.timer.warn { border-color: var(--warn); background: var(--warn-soft); }
.timer.warn .dot, .timer.warn .clock { color: var(--warn); }
.timer.warn .dot { background: var(--warn); }
.timer.crit { border-color: var(--bad); background: var(--bad-soft); }
.timer.crit .clock { color: var(--bad); }
.timer.crit .dot { background: var(--bad); animation: blink 1s steps(2, start) infinite; }
@keyframes blink { to { visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { .timer.crit .dot { animation: none; } }

.layout { display: grid; grid-template-columns: 268px minmax(0, 1fr); align-items: start; }
.sidebar {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 59px);
  height: calc(100vh - 59px); overflow-y: auto;
  border-right: 1px solid var(--line); background: var(--surface);
  padding: 20px 16px; display: grid; align-content: start; gap: 20px;
}
.side-block { display: grid; gap: 10px; }
.progress-row { display: flex; justify-content: space-between; align-items: baseline; font-size: 13px; }
.progress-row b { font-family: var(--mono); font-variant-numeric: tabular-nums; }
.bar { height: 6px; border-radius: 3px; background: var(--surface-2); border: 1px solid var(--line); overflow: hidden; }
.bar > span { display: block; height: 100%; background: var(--accent); transition: width .25s; }
.bar.time > span { background: var(--muted); }
.qlist { display: grid; gap: 4px; list-style: none; margin: 0; padding: 0; }
.qbtn {
  width: 100%; display: grid; grid-template-columns: 30px 1fr auto; gap: 10px; align-items: center;
  text-align: left; padding: 9px 10px; border-radius: 6px; border: 1px solid transparent;
  background: transparent; cursor: pointer;
}
.qbtn:hover { background: var(--surface-2); }
.qbtn.active { background: var(--accent-soft); border-color: var(--accent); }
.qnum {
  width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center;
  font-family: var(--mono); font-weight: 600; font-size: 13px;
  border: 1.5px solid var(--line-strong); color: var(--muted); background: var(--surface);
}
.qbtn[data-state="partial"] .qnum { border-color: var(--warn); color: var(--warn); border-style: dashed; }
.qbtn[data-state="done"] .qnum { border-color: var(--ok); background: var(--ok); color: #fff; }
.qmeta { display: grid; min-width: 0; }
.qmeta .qt { font-size: 13.5px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.qmeta .qs { font-size: 12px; color: var(--muted); }
.qflag { color: var(--warn); font-size: 12px; font-weight: 600; }
.legend { display: grid; gap: 6px; font-size: 12px; color: var(--muted); }
.legend span { display: flex; align-items: center; gap: 8px; }
.legend i { width: 12px; height: 12px; border-radius: 50%; border: 1.5px solid var(--line-strong); display: inline-block; }
.legend i.p { border-color: var(--warn); border-style: dashed; }
.legend i.d { border-color: var(--ok); background: var(--ok); }

.main { padding-inline: 32px; padding-block: 28px 48px; display: grid; gap: 24px; max-width: 1100px; width: 100%; }
.qhead { display: grid; gap: 10px; }
.qhead h2 { font-size: 24px; letter-spacing: -.005em; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.prose { display: grid; gap: 10px; max-width: 76ch; }
.prose ul { margin: 0; padding-left: 20px; display: grid; gap: 5px; }
.prose code, .inline-code { font-family: var(--mono); font-size: .88em; padding: 1px 5px; border-radius: 4px; background: var(--code-bg); border: 1px solid var(--line); }

.io { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; }
.panel { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; background: var(--surface); display: flex; flex-direction: column; min-width: 0; }
.panel-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 8px 12px; border-bottom: 1px solid var(--line); background: var(--surface-2); }
.code-block {
  margin: 0; padding: 14px 16px; font-size: 12.8px; line-height: 1.6; overflow-x: auto;
  background: var(--code-bg); color: var(--ink); white-space: pre; tab-size: 4; flex: 1;
}
.console {
  margin: 0; padding: 14px 16px; font-size: 12.8px; line-height: 1.6; overflow-x: auto;
  background: var(--console-bg); color: var(--console-ink); white-space: pre; flex: 1;
}
.console .ps { color: var(--console-muted); }
.panel.console-panel .panel-h { background: var(--console-bg); border-bottom-color: rgba(255,255,255,.12); }
.panel.console-panel .panel-h .label { color: var(--console-muted); }
.panel.console-panel { border-color: var(--console-bg); }

.t-kw { color: var(--tok-kw); font-weight: 500; }
.t-cmd { color: var(--tok-cmd); }
.t-var { color: var(--tok-var); }
.t-str { color: var(--tok-str); }
.t-com { color: var(--tok-com); font-style: italic; }
.t-op { color: var(--tok-op); }
.t-type { color: var(--tok-type); }
.t-num { color: var(--tok-num); }

.editor-wrap { display: grid; gap: 8px; }
.editor-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.editor-head .hint { font-size: 12.5px; color: var(--muted); }
.editor {
  display: grid; grid-template-columns: auto 1fr; border: 1px solid var(--line-strong); border-radius: 8px;
  background: var(--code-bg); overflow: hidden; min-height: 300px;
}
.editor:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.gutter {
  padding: 14px 10px 14px 12px; text-align: right; color: var(--muted); opacity: .7; user-select: none;
  font-family: var(--mono); font-size: 13px; line-height: 1.6; white-space: pre; overflow: hidden;
  border-right: 1px solid var(--line); background: var(--surface-2); font-variant-numeric: tabular-nums;
}
.editor textarea {
  width: 100%; min-height: 300px; resize: vertical; border: 0; outline: none; background: transparent;
  color: var(--ink); padding: 14px 16px; font-family: var(--mono); font-size: 13px; line-height: 1.6;
  white-space: pre; overflow-wrap: normal; overflow-x: auto; tab-size: 4;
}
.editor textarea[readonly] { cursor: default; }

.checkpoint { border: 1px solid var(--line); border-radius: 8px; background: var(--surface); padding: 18px 20px; display: grid; gap: 12px; }
.checkpoint-h { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; align-items: baseline; }
.checkpoint .qtext { font-weight: 500; max-width: 80ch; }
.options { display: grid; gap: 8px; }
.opt {
  display: grid; grid-template-columns: 20px 1fr; gap: 10px; align-items: start; padding: 10px 12px;
  border: 1px solid var(--line); border-radius: 6px; cursor: pointer; background: var(--surface);
}
.opt:hover { border-color: var(--line-strong); background: var(--surface-2); }
.opt input { margin: 3px 0 0; accent-color: var(--accent); }
.opt.sel { border-color: var(--accent); background: var(--accent-soft); }
.opt.locked { cursor: default; }

.qnav { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; border-top: 1px solid var(--line); padding-top: 20px; }
.qnav .mid { display: flex; gap: 8px; align-items: center; }
.save-note { font-size: 12.5px; color: var(--muted); }

/* ---------- Modal ---------- */
.modal-bg { position: fixed; inset: 0; background: rgba(8, 12, 20, .55); display: grid; place-items: center; padding: 16px; z-index: 50; }
.modal { width: min(480px, 100%); background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); padding: 24px; display: grid; gap: 14px; }
.modal h3 { font-size: 18px; }
.modal p { color: var(--muted); }
.modal .actions { display: flex; justify-content: flex-end; gap: 10px; flex-wrap: wrap; margin-top: 4px; }
.modal ul { margin: 0; padding-left: 18px; color: var(--ink); font-size: 14px; display: grid; gap: 4px; }
.err { color: var(--bad); font-size: 13px; }

/* ---------- Results ---------- */
.results { padding-inline: 16px; padding-block: 32px 64px; }
.results-inner { max-width: 1040px; margin: 0 auto; display: grid; gap: 28px; }
.banner { display: flex; gap: 12px; align-items: center; padding: 12px 16px; border-radius: 8px; border: 1px solid var(--warn); background: var(--warn-soft); color: var(--warn); font-weight: 500; }
.summary { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--shadow); overflow: hidden; }
.summary-top { display: grid; grid-template-columns: 1.1fr 2fr; gap: 0; }
.score-cell { padding: 28px 32px; border-right: 1px solid var(--line); display: grid; gap: 6px; align-content: center; }
.score-big { font-family: var(--mono); font-size: 56px; font-weight: 600; line-height: 1; font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
.score-big small { font-size: 22px; color: var(--muted); font-weight: 500; }
.score-note { font-size: 13px; color: var(--muted); max-width: 36ch; }
.meta-cell { padding: 24px 28px; display: grid; gap: 16px; }
.meta-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px 24px; }
.meta-grid div { display: grid; gap: 2px; }
.meta-grid .v { font-family: var(--mono); font-size: 16px; font-weight: 600; font-variant-numeric: tabular-nums; }
.split { display: grid; gap: 6px; }
.split-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); }
.split-bar .a { background: var(--ok); }
.split-bar .b { background: var(--accent); }
.split-legend { display: flex; flex-wrap: wrap; gap: 16px; font-size: 12.5px; color: var(--muted); }
.split-legend i { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 6px; vertical-align: -1px; }
.summary-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; padding: 14px 20px; border-top: 1px solid var(--line); background: var(--surface-2); }
.summary-actions .grp { display: flex; flex-wrap: wrap; gap: 10px; }

.score-table { width: 100%; border-collapse: collapse; font-size: 14px; background: var(--surface); }
.score-table th, .score-table td { padding: 10px 14px; border-bottom: 1px solid var(--line); text-align: left; white-space: nowrap; }
.score-table th { font-size: 11.5px; letter-spacing: .07em; text-transform: uppercase; color: var(--muted); font-weight: 600; background: var(--surface-2); }
.score-table td.n, .score-table th.n { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; }
.score-table tr:last-child td { border-bottom: 0; }
.score-table tfoot td { font-weight: 600; background: var(--surface-2); }
.card-table { border: 1px solid var(--line); border-radius: 8px; overflow-x: auto; }

.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 4px; font-size: 12px; font-weight: 600; white-space: nowrap; }
.pill.ok { background: var(--ok-soft); color: var(--ok); }
.pill.bad { background: var(--bad-soft); color: var(--bad); }
.pill.warn { background: var(--warn-soft); color: var(--warn); }
.pill.neutral { background: var(--surface-2); color: var(--muted); border: 1px solid var(--line); }
.pill.accent { background: var(--accent-soft); color: var(--accent); }

.review-q { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.review-q > summary { list-style: none; cursor: pointer; padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
.review-q > summary::-webkit-details-marker { display: none; }
.review-q > summary h3 { font-size: 16px; }
.review-q > summary .sum-l { display: flex; gap: 12px; align-items: center; min-width: 0; }
.review-q > summary .caret { color: var(--muted); font-family: var(--mono); transition: transform .15s; }
.review-q[open] > summary .caret { transform: rotate(90deg); }
.review-body { border-top: 1px solid var(--line); padding: 20px; display: grid; gap: 20px; }
.rev-grid { display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 20px; align-items: start; }
.rev-col { display: grid; gap: 10px; min-width: 0; }

</style>

<div id="app"></div>

<script src="exercises.js"></script>
<script>
(() => {
'use strict';

/* =====================================================================
   Exercise bank
   ===================================================================== */
const { Q, TOTAL_SECONDS, TOTAL_POINTS, esc, pad, fmtClock, fmtDur, highlight } = window.PSA;
const STORE_KEY = 'psAssessment.v1';

/* =====================================================================
   State
   ===================================================================== */
function freshState() {
  return {
    phase: 'intro',
    candidate: '',
    startedAt: null,
    deadline: null,
    submittedAt: null,
    autoSubmitted: false,
    current: 0,
    answers: Object.fromEntries(Q.map(q => [q.id, { code: q.starter, choice: null, flagged: false, spent: 0 }])),
  };
}
let S = load() || freshState();
let modal = null;
let tickHandle = null;
let lastTick = Date.now();
let saveTimer = null;

function load() {
  try {
    const raw = localStorage.getItem(STORE_KEY);
    if (!raw) return null;
    const s = JSON.parse(raw);
    if (!s || !s.answers) return null;
    Q.forEach(q => { if (!s.answers[q.id]) s.answers[q.id] = { code: q.starter, choice: null, flagged: false, spent: 0 }; });
    return s;
  } catch (e) { return null; }
}
function save() {
  try { localStorage.setItem(STORE_KEY, JSON.stringify(S)); } catch (e) { /* storage unavailable: state stays in memory */ }
}
function saveSoon() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(save, 300);
}

/* =====================================================================
   Helpers
   ===================================================================== */
const $ = sel => document.querySelector(sel);
const remaining = () => S.deadline ? (S.deadline - Date.now()) / 1000 : TOTAL_SECONDS;

const hasWork = q => PSA.hasWork(q, S.answers[q.id]);
const qState = q => PSA.qState(q, S.answers[q.id]);
const stateLabel = { done: 'Answered', partial: 'In progress', empty: 'Not started' };
const anyAnswer = () => Q.some(q => qState(q) !== 'empty');

/* =====================================================================
   Scoring
   ===================================================================== */
/* =====================================================================
   Rendering
   ===================================================================== */
function render() {
  const app = $('#app');
  if (S.phase === 'intro') app.innerHTML = viewIntro();
  else if (S.phase === 'test') app.innerHTML = viewTest();
  else app.innerHTML = viewResults();
  app.insertAdjacentHTML('beforeend', modal ? viewModal() : '');
  bind();
}

function viewIntro() {
  const rows = Q.map((q, i) => `<tr><td class="qn">${i + 1}</td><td>${esc(q.title)}</td><td>${q.level}</td><td class="n">${q.minutes} min</td><td class="n">${q.points}</td></tr>`).join('');
  return `
  <div class="intro">
    <div class="intro-card">
      <div class="intro-head">
        <div class="prompt-line"><b>PS C:\\Assessment&gt;</b> Start-Assessment -Track PowerShell</div>
        <h1>PowerShell Practical Assessment</h1>
        <p>Five hands-on exercises covering the pipeline, objects, advanced functions, error handling and a small automation task. Everything you need is on the page: no Windows, Active Directory or cloud access is required.</p>
      </div>
      <div class="intro-body">
        <div class="facts">
          <div class="fact"><span class="label">Time limit</span><span class="v">30:00</span></div>
          <div class="fact"><span class="label">Exercises</span><span class="v">5</span></div>
          <div class="fact"><span class="label">Total points</span><span class="v">${TOTAL_POINTS}</span></div>
        </div>
        <div class="table-wrap">
          <table class="plan-table">
            <thead><tr><th>#</th><th>Exercise</th><th>Level</th><th class="n">Suggested</th><th class="n">Points</th></tr></thead>
            <tbody>${rows}</tbody>
          </table>
        </div>
        <div style="display:grid;gap:10px">
          <span class="label">How it works</span>
          <ul class="rules">
            <li>Each exercise has a code answer and a short checkpoint question. Write code as you would in a real script; nothing is executed.</li>
            <li>Your answers are scored by the hiring team after you send them. Partial answers still earn credit, so write what you can.</li>
            <li>The timer starts when you press <b>Start test</b> and keeps running if you reload the page. At 00:00 your answers are submitted automatically.</li>
            <li>Answers are saved in this browser as you type. You can move between exercises freely and flag any you want to revisit.</li>
            <li>When you submit, you get a submission code. Send it to the person who invited you; that is how your answers reach the hiring team.</li>
            <li>Tab inserts four spaces in the editor. Press Esc, then Tab, to move focus out of it.</li>
          </ul>
        </div>
        <div class="start-row">
          <div class="field">
            <label class="label" for="candName">Candidate name (optional)</label>
            <input class="input" id="candName" autocomplete="name" placeholder="e.g. Sam Rivera" value="${esc(S.candidate)}">
          </div>
          <button class="btn primary" id="startBtn" style="height:42px;padding:0 22px">Start test · 30:00</button>
        </div>
      </div>
    </div>
  </div>`;
}

function viewTest() {
  const q = Q[S.current], a = S.answers[q.id];
  const doneCount = Q.filter(x => qState(x) === 'done').length;
  const rem = remaining();
  const tcls = rem <= 60 ? 'crit' : rem <= 300 ? 'warn' : '';
  const qitems = Q.map((x, i) => {
    const st = qState(x);
    return `<li><button class="qbtn ${i === S.current ? 'active' : ''}" data-go="${i}" data-state="${st}" aria-current="${i === S.current ? 'step' : 'false'}" aria-label="Exercise ${i + 1}, ${stateLabel[st]}${S.answers[x.id].flagged ? ', flagged' : ''}">
      <span class="qnum">${i + 1}</span>
      <span class="qmeta"><span class="qt">${esc(x.short)}</span><span class="qs">${x.points} pts · ${stateLabel[st]}</span></span>
      ${S.answers[x.id].flagged ? '<span class="qflag" title="Flagged">⚑</span>' : '<span></span>'}
    </button></li>`;
  }).join('');
  const cp = q.checkpoint;
  const opts = cp.options.map((o, i) => `
    <label class="opt ${a.choice === i ? 'sel' : ''}" for="cp_${q.id}_${i}">
      <input type="radio" name="cp_${q.id}" id="cp_${q.id}_${i}" value="${i}" ${a.choice === i ? 'checked' : ''}>
      <span>${esc(o)}</span>
    </label>`).join('');
  const lines = (a.code.match(/\n/g) || []).length + 1;
  return `
  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <span class="glyph" aria-hidden="true">&gt;_</span>
        <div style="display:grid;min-width:0">
          <span class="t">PowerShell Practical Assessment</span>
          <span class="c">${S.candidate ? esc(S.candidate) + ' · ' : ''}Exercise ${S.current + 1} of ${Q.length}</span>
        </div>
      </div>
      <div class="timer ${tcls}" id="timerBox" role="timer" aria-live="off" title="Time remaining">
        <span class="dot" aria-hidden="true"></span><span class="clock" id="clock">${fmtClock(rem)}</span>
      </div>
      <button class="btn primary" id="submitTop">Submit<span class="full"> test</span></button>
    </header>
    <div class="layout">
      <aside class="sidebar" aria-label="Exercises">
        <div class="side-block">
          <div class="progress-row"><span class="label">Progress</span><b id="progText">${doneCount} / ${Q.length}</b></div>
          <div class="bar"><span style="width:${doneCount / Q.length * 100}%"></span></div>
        </div>
        <ul class="qlist">${qitems}</ul>
        <div class="side-block side-time">
          <div class="progress-row"><span class="label">Time remaining</span><b id="sideClock">${fmtClock(rem)}</b></div>
          <div class="bar time"><span id="timeBar" style="width:${Math.max(0, rem) / TOTAL_SECONDS * 100}%"></span></div>
          <div class="progress-row small"><span class="muted">On this exercise</span><b id="spentClock">${fmtClock(a.spent)}</b></div>
        </div>
        <div class="legend">
          <span><i></i>Not started</span>
          <span><i class="p"></i>In progress (code or checkpoint)</span>
          <span><i class="d"></i>Answered (code and checkpoint)</span>
        </div>
      </aside>
      <main class="main">
        <div class="qhead">
          <span class="label">Exercise ${S.current + 1} of ${Q.length}</span>
          <h2>${esc(q.title)}</h2>
          <div class="chips">
            <span class="chip"><strong>${q.points}</strong> points</span>
            <span class="chip">Suggested <strong>${q.minutes} min</strong></span>
            <span class="chip">${q.level}</span>
            <span class="chip">Checkpoint <strong>${cp.points} pts</strong></span>
          </div>
        </div>
        <div class="prose">${q.statement}</div>
        <div class="io">
          <div class="panel">
            <div class="panel-h"><span class="label">Sample input</span></div>
            <pre class="code-block">${highlight(q.input)}</pre>
          </div>
          <div class="panel console-panel">
            <div class="panel-h"><span class="label">Expected output</span></div>
            <pre class="console">${q.outputIsHtml ? q.output : esc(q.output)}</pre>
          </div>
        </div>
        <div class="editor-wrap">
          <div class="editor-head">
            <label class="label" for="code">Your solution</label>
            <span class="hint" id="saveNote">Saved automatically</span>
          </div>
          <div class="editor">
            <div class="gutter" id="gutter" aria-hidden="true">${Array.from({ length: lines }, (_, i) => i + 1).join('\n')}</div>
            <textarea id="code" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="PowerShell solution for exercise ${S.current + 1}">${esc(a.code)}</textarea>
          </div>
        </div>
        <fieldset class="checkpoint" style="margin:0">
          <div class="checkpoint-h"><legend class="label" style="padding:0">Checkpoint</legend><span class="pill accent">${cp.points} pts</span></div>
          <p class="qtext">${cp.text}</p>
          <div class="options" id="opts">${opts}</div>
        </fieldset>
        <nav class="qnav" aria-label="Exercise navigation">
          <button class="btn" id="prevBtn" ${S.current === 0 ? 'disabled' : ''}>← Previous</button>
          <div class="mid">
            <button class="btn sm ${a.flagged ? 'flag-on' : ''}" id="flagBtn" aria-pressed="${a.flagged}">⚑ ${a.flagged ? 'Flagged' : 'Flag for review'}</button>
          </div>
          ${S.current === Q.length - 1
            ? '<button class="btn primary" id="submitBottom">Submit test</button>'
            : '<button class="btn primary" id="nextBtn">Next →</button>'}
        </nav>
      </main>
    </div>
  </div>`;
}

function viewModal() {
  if (modal.type === 'submit') {
    const notDone = Q.map((q, i) => ({ q, i, st: qState(q) })).filter(x => x.st !== 'done');
    const flagged = Q.map((q, i) => ({ q, i })).filter(x => S.answers[x.q.id].flagged);
    return `<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h3 id="mTitle">Submit your test?</h3>
      <p>You have <b style="color:var(--ink)">${fmtClock(remaining())}</b> left. After submitting, your answers are locked and cannot be changed.</p>
      ${notDone.length ? `<div style="display:grid;gap:6px"><span class="label">Incomplete</span><ul>${notDone.map(x => `<li>Exercise ${x.i + 1}: ${esc(x.q.short)} (${stateLabel[x.st].toLowerCase()})</li>`).join('')}</ul></div>` : '<p>All five exercises have a code answer and a checkpoint answer.</p>'}
      ${flagged.length ? `<div style="display:grid;gap:6px"><span class="label">Flagged</span><ul>${flagged.map(x => `<li>Exercise ${x.i + 1}: ${esc(x.q.short)}</li>`).join('')}</ul></div>` : ''}
      <div class="actions"><button class="btn" id="mCancel">Keep working</button><button class="btn primary" id="mConfirm">Submit test</button></div>
    </div></div>`;
  }
  if (modal.type === 'restart') {
    return `<div class="modal-bg" id="modalBg"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
      <h3 id="mTitle">Restart the test?</h3>
      <p>This clears your submitted answers from this browser and starts a new attempt. Send your submission code first: after restarting, it cannot be recovered.</p>
      <div class="actions"><button class="btn" id="mCancel">Cancel</button><button class="btn danger" id="mConfirm">Clear and restart</button></div>
    </div></div>`;
  }
  return '';
}

function viewResults() {
  const totalSpent = S.submittedAt && S.startedAt ? Math.min(TOTAL_SECONDS, (S.submittedAt - S.startedAt) / 1000) : 0;
  const answered = Q.filter(q => qState(q) === 'done').length;
  const flagged = Q.filter(q => S.answers[q.id].flagged).length;
  const reviews = Q.map((q, i) => {
    const a = S.answers[q.id], st = qState(q);
    return `<details class="review-q">
      <summary>
        <div class="sum-l"><span class="caret">▸</span><h3>${i + 1}. ${esc(q.title)}</h3></div>
        <div style="display:flex;gap:8px;flex-wrap:wrap">
          ${a.flagged ? '<span class="pill warn">⚑ Flagged</span>' : ''}
          ${st === 'done' ? '<span class="pill ok">Answered</span>' : st === 'partial' ? '<span class="pill warn">Partial</span>' : '<span class="pill neutral">No answer</span>'}
          <span class="pill neutral">${fmtDur(a.spent)}</span>
        </div>
      </summary>
      <div class="review-body">
        <div class="rev-grid">
          <div class="rev-col">
            <span class="label">Your code</span>
            <div class="answer-code">${hasWork(q) ? `<pre class="code-block">${highlight(a.code.replace(/\s+$/, ''))}</pre>` : `<div class="empty-answer">${q.id === 'q4' ? 'Starter script left unchanged.' : 'No code submitted.'}</div>`}</div>
          </div>
          <div class="rev-col">
            <span class="label">Your checkpoint answer</span>
            <div class="cp-result">${a.choice === null ? '<span class="muted">No answer</span>' : esc(q.checkpoint.options[a.choice])}</div>
          </div>
        </div>
      </div>
    </details>`;
  }).join('');

  return `<div class="results"><div class="results-inner">
    ${S.autoSubmitted ? '<div class="banner" role="status">⏱ Time expired. Your answers were submitted automatically at 00:00.</div>' : ''}
    <div style="display:grid;gap:6px">
      <span class="label">Assessment complete</span>
      <h1 style="font-size:28px">${S.candidate ? esc(S.candidate) + ', your' : 'Your'} answers are locked</h1>
      <p class="muted" style="max-width:70ch">Thank you for taking the test. There is one step left: send your submission code so the hiring team receives your answers.</p>
    </div>
    <section class="send-box" aria-labelledby="sendTitle">
      <div class="send-h">
        <div style="display:grid;gap:4px">
          <span class="label">Final step</span>
          <h2 id="sendTitle">Send your submission code to the hiring team</h2>
          <p class="muted small" style="max-width:68ch">Your answers are stored only in this browser until you send them. Copy the whole code below and paste it into an email or message to the person who sent you this test.</p>
        </div>
        <button class="btn primary" id="copyCode" disabled>Copy submission code</button>
      </div>
      <textarea id="subCode" class="sub-code" readonly spellcheck="false" aria-label="Submission code" placeholder="Preparing your code…"></textarea>
      <div class="send-foot"><span class="muted small" id="subLen"></span><span class="small" id="subNote" aria-live="polite"></span></div>
    </section>
    <section class="summary">
      <div class="meta-cell">
        <div class="meta-grid" style="grid-template-columns:repeat(4,minmax(0,1fr))">
          <div><span class="label">Time used</span><span class="v">${fmtClock(totalSpent)} <span class="muted" style="font-weight:400;font-size:13px">of 30:00</span></span></div>
          <div><span class="label">Fully answered</span><span class="v">${answered} / ${Q.length}</span></div>
          <div><span class="label">Flagged</span><span class="v">${flagged}</span></div>
          <div><span class="label">Submitted</span><span class="v" style="font-size:14px">${S.submittedAt ? new Date(S.submittedAt).toLocaleString() : '—'}</span></div>
        </div>
      </div>
      <div class="summary-actions">
        <span class="muted small" style="align-self:center">Scores are shared by the hiring team after review.</span>
        <button class="btn sm" id="restartBtn">Restart test</button>
      </div>
    </section>
    <section style="display:grid;gap:12px">
      <div class="section-h"><h2>Your answers</h2><span class="muted small">Read-only</span></div>
      ${reviews}
    </section>
  </div></div>`;
}

/* =====================================================================
   Behaviour
   ===================================================================== */
function bind() {
  const on = (sel, ev, fn) => { const el = $(sel); if (el) el.addEventListener(ev, fn); };

  // Intro
  on('#candName', 'input', e => { S.candidate = e.target.value.slice(0, 80); saveSoon(); });
  on('#startBtn', 'click', startTest);

  // Test
  document.querySelectorAll('[data-go]').forEach(b => b.addEventListener('click', () => go(+b.dataset.go)));
  on('#prevBtn', 'click', () => go(S.current - 1));
  on('#nextBtn', 'click', () => go(S.current + 1));
  on('#flagBtn', 'click', () => { const a = S.answers[Q[S.current].id]; a.flagged = !a.flagged; save(); render(); });
  on('#submitTop', 'click', () => { modal = { type: 'submit' }; render(); $('#mConfirm')?.focus(); });
  on('#submitBottom', 'click', () => { modal = { type: 'submit' }; render(); $('#mConfirm')?.focus(); });
  const ta = $('#code');
  if (ta) {
    ta.addEventListener('input', onCode);
    ta.addEventListener('keydown', onEditorKey);
    ta.addEventListener('scroll', () => { $('#gutter').scrollTop = ta.scrollTop; });
  }
  document.querySelectorAll('#opts input[type=radio]').forEach(r => r.addEventListener('change', () => {
    S.answers[Q[S.current].id].choice = +r.value; save(); refreshNav();
    document.querySelectorAll('#opts .opt').forEach(l => l.classList.toggle('sel', l.querySelector('input').checked));
  }));

  // Results
  on('#restartBtn', 'click', () => { modal = { type: 'restart' }; render(); $('#mCancel')?.focus(); });
  on('#copyCode', 'click', copySubmissionCode);
  if ($('#subCode')) {
    if (subCode) { $('#subCode').value = subCode; $('#subLen').textContent = `${subCode.length.toLocaleString()} characters`; $('#copyCode').disabled = false; }
    else buildSubmissionCode();
  }
  // Modal
  on('#mCancel', 'click', closeModal);
  on('#modalBg', 'click', e => { if (e.target.id === 'modalBg') closeModal(); });
  on('#mConfirm', 'click', () => {
    if (modal.type === 'submit') { modal = null; submit(false); }
    else if (modal.type === 'restart') { modal = null; restart(); }
  });
}
function keepScroll(fn) { const y = window.scrollY; fn(); window.scrollTo(0, y); }
function closeModal() { modal = null; render(); }

document.addEventListener('keydown', e => { if (e.key === 'Escape' && modal) closeModal(); });

function startTest() {
  const name = $('#candName'); if (name) S.candidate = name.value.trim().slice(0, 80);
  S.phase = 'test';
  S.attemptId = newAttemptId();
  S.startedAt = Date.now();
  S.deadline = S.startedAt + TOTAL_SECONDS * 1000;
  S.current = 0;
  save();
  render();
  startTicking();
  window.scrollTo(0, 0);
}

function newAttemptId() {
  const r = new Uint8Array(8);
  try { crypto.getRandomValues(r); } catch (e) { for (let i = 0; i < 8; i++) r[i] = Math.random() * 256; }
  return 'a' + Date.now().toString(36) + Array.from(r, b => b.toString(16).padStart(2, '0')).join('');
}

let subCode = '';
function buildSubmissionCode() {
  if (!S.attemptId) { S.attemptId = newAttemptId(); save(); }
  const payload = {
    v: 1, attemptId: S.attemptId, candidate: S.candidate,
    startedAt: S.startedAt, submittedAt: S.submittedAt, autoSubmitted: S.autoSubmitted,
    answers: Object.fromEntries(Q.map(q => {
      const a = S.answers[q.id];
      return [q.id, { code: hasWork(q) ? a.code : '', choice: a.choice, flagged: a.flagged, spent: Math.round(a.spent) }];
    }))
  };
  PSA.encodeSubmission(payload).then(code => {
    subCode = code;
    const ta = $('#subCode'); if (ta) ta.value = code;
    const n = $('#subLen'); if (n) n.textContent = `${code.length.toLocaleString()} characters`;
    const b = $('#copyCode'); if (b) b.disabled = false;
  });
}
function copySubmissionCode() {
  const ta = $('#subCode'), note = $('#subNote');
  const fallback = () => { ta.focus(); ta.select(); note.textContent = 'Copying is blocked here. The code is selected; press Ctrl+C (or ⌘C) to copy it.'; };
  try {
    navigator.clipboard.writeText(subCode).then(() => { note.textContent = 'Copied. Paste it into your email or message to the hiring team.'; }, fallback);
  } catch (e) { fallback(); }
}

function go(i) {
  if (i < 0 || i >= Q.length || i === S.current) return;
  S.current = i; save(); render(); window.scrollTo(0, 0);
}

let codeEscape = false;
function onEditorKey(e) {
  const ta = e.target;
  if (e.key === 'Escape') { codeEscape = true; return; }
  if (e.key === 'Tab' && !codeEscape) {
    e.preventDefault();
    const s = ta.selectionStart, en = ta.selectionEnd, v = ta.value;
    if (s !== en && v.slice(s, en).includes('\n')) {
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const block = v.slice(ls, en);
      const nb = e.shiftKey ? block.replace(/^ {1,4}/gm, '') : block.replace(/^/gm, '    ');
      ta.value = v.slice(0, ls) + nb + v.slice(en);
      ta.selectionStart = ls; ta.selectionEnd = ls + nb.length;
    } else if (e.shiftKey) {
      const ls = v.lastIndexOf('\n', s - 1) + 1;
      const m = v.slice(ls).match(/^ {1,4}/);
      if (m) { ta.value = v.slice(0, ls) + v.slice(ls + m[0].length); ta.selectionStart = ta.selectionEnd = Math.max(ls, s - m[0].length); }
    } else {
      ta.value = v.slice(0, s) + '    ' + v.slice(en);
      ta.selectionStart = ta.selectionEnd = s + 4;
    }
    onCode({ target: ta });
    return;
  }
  if (e.key === 'Enter' && !e.shiftKey && !e.ctrlKey && !e.metaKey) {
    // keep indentation of the current line
    const s = ta.selectionStart, v = ta.value;
    const ls = v.lastIndexOf('\n', s - 1) + 1;
    const indent = (v.slice(ls, s).match(/^[ \t]*/) || [''])[0];
    const extra = /[{(]\s*$/.test(v.slice(ls, s)) ? '    ' : '';
    if (indent || extra) {
      e.preventDefault();
      const ins = '\n' + indent + extra;
      ta.value = v.slice(0, s) + ins + v.slice(ta.selectionEnd);
      ta.selectionStart = ta.selectionEnd = s + ins.length;
      onCode({ target: ta });
    }
  }
  codeEscape = false;
}
function onCode(e) {
  const ta = e.target;
  S.answers[Q[S.current].id].code = ta.value;
  const lines = (ta.value.match(/\n/g) || []).length + 1;
  const g = $('#gutter');
  if (g) {
    if (g.textContent.split('\n').length !== lines) g.textContent = Array.from({ length: lines }, (_, i) => i + 1).join('\n');
    g.scrollTop = ta.scrollTop;
  }
  saveSoon();
  refreshNav();
  const n = $('#saveNote'); if (n) n.textContent = 'Saved automatically';
}
function refreshNav() {
  document.querySelectorAll('[data-go]').forEach(b => {
    const q = Q[+b.dataset.go], st = qState(q);
    b.dataset.state = st;
    const qs = b.querySelector('.qs'); if (qs) qs.textContent = `${q.points} pts · ${stateLabel[st]}`;
  });
  const done = Q.filter(x => qState(x) === 'done').length;
  const pt = $('#progText'); if (pt) pt.textContent = `${done} / ${Q.length}`;
  const bar = document.querySelector('.sidebar .bar:not(.time) > span'); if (bar) bar.style.width = `${done / Q.length * 100}%`;
}

function submit(auto) {
  if (S.phase !== 'test') return;
  const ta = $('#code'); if (ta) S.answers[Q[S.current].id].code = ta.value;
  S.phase = 'done';
  S.autoSubmitted = auto;
  S.submittedAt = auto ? Math.min(Date.now(), S.deadline) : Date.now();
  stopTicking();
  save();
  render();
  window.scrollTo(0, 0);
}

function restart() {
  S = freshState();
  subCode = '';
  save();
  render();
  window.scrollTo(0, 0);
}

function startTicking() {
  stopTicking();
  lastTick = Date.now();
  tickHandle = setInterval(tick, 250);
}
function stopTicking() { if (tickHandle) clearInterval(tickHandle); tickHandle = null; }
function tick() {
  if (S.phase !== 'test') return stopTicking();
  const now = Date.now();
  const dt = Math.min(5, (now - lastTick) / 1000);
  lastTick = now;
  if (!document.hidden && !modal) S.answers[Q[S.current].id].spent += dt;
  const rem = remaining();
  if (rem <= 0) { modal = null; submit(true); return; }
  const c = $('#clock'); if (c) c.textContent = fmtClock(rem);
  const sc = $('#sideClock'); if (sc) sc.textContent = fmtClock(rem);
  const sp = $('#spentClock'); if (sp) sp.textContent = fmtClock(S.answers[Q[S.current].id].spent);
  const tb = $('#timeBar'); if (tb) tb.style.width = `${rem / TOTAL_SECONDS * 100}%`;
  const box = $('#timerBox');
  if (box) { box.classList.toggle('warn', rem <= 300 && rem > 60); box.classList.toggle('crit', rem <= 60); }
  if (Math.floor(now / 1000) % 5 === 0) saveSoon();
}

window.addEventListener('beforeunload', e => {
  if (S.phase === 'test' && anyAnswer()) { save(); e.preventDefault(); e.returnValue = ''; }
});
document.addEventListener('visibilitychange', () => { lastTick = Date.now(); if (document.hidden) save(); });

/* Boot */
if (S.phase === 'test') {
  if (remaining() <= 0) { submit(true); }
  else { render(); startTicking(); }
} else {
  render();
}
})();
</script>

</body>
